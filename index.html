<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Tracker PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновые световые акценты (Liquid Glass) -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <!-- Шапка приложения -->
        <header>
            <div class="header-container">
                <div class="logo">StudyTracker <span>PRO</span></div>
                <button id="open-settings-btn" class="btn btn-icon desktop-only-btn">⚙️ Настройки</button>
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <!-- Блок формы создания/редактирования дисциплины (для ПК) -->
            <section id="form-section" class="form-section glass-element">
                <h2 id="form-title" style="margin-bottom: 20px; font-size: 18px; font-weight: 800;">Новая дисциплина</h2>
                <form id="tracker-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label for="subject-name">Название</label>
                        <input type="text" id="subject-name" required placeholder="Например: Высшая математика">
                    </div>

                    <div class="form-group">
                        <label for="subject-type">Тип работы</label>
                        <select id="subject-type">
                            <option value="Лекции">Лекции</option>
                            <option value="Практика">Практика</option>
                            <option value="Лабораторная">Лабораторная</option>
                            <option value="Семинар">Семинар</option>
                            <option value="Курсовая">Курсовая</option>
                            <option value="Проект">Проект</option>
                        </select>
                    </div>

                    <!-- Переключатель цели -->
                    <div class="form-group" style="display: flex; align-items: center; margin-bottom: 12px;">
                        <input type="checkbox" id="has-target-checkbox" checked style="cursor: pointer;">
                        <label for="has-target-checkbox" style="margin: 0; cursor: pointer; display: inline;">Есть общее количество работ</label>
                    </div>

                    <div id="target-inputs-row">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="total-tasks">Всего работ (макс. 25)</label>
                                <input type="number" id="total-tasks" min="1" max="25" placeholder="10">
                            </div>
                            <div class="form-group">
                                <label for="done-tasks">Уже выполнено</label>
                                <input type="number" id="done-tasks" min="0" max="25" value="0" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="deadline-date">Дедлайн</label>
                        <input type="datetime-local" id="deadline-date">
                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="submit-btn" class="btn btn-success" style="flex: 1;">Сохранить</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Отмена</button>
                    </div>
                </form>
            </section>

            <!-- Сетка карточек дисциплин -->
            <section class="display-section">
                <div id="subjects-list" class="grid">
                    <!-- Карточки будут динамически добавляться через JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Мобильное нижнее меню (Dock-бар) -->
    <nav class="mobile-dock glass-element">
        <button id="dock-home-btn" class="dock-item active">Список</button>
        <button id="dock-add-btn" class="dock-plus">+</button>
        <button id="dock-settings-btn" class="dock-item">Настройки</button>
    </nav>

    <!-- Мобильное модальное окно для создания/редактирования дисциплины -->
    <div id="modal-form-overlay" class="modal-overlay hidden">
        <div class="modal-content glass-element">
            <div class="modal-header">
                <h3 id="modal-form-title" style="font-size: 18px; font-weight: 800;">Новая дисциплина</h3>
                <button id="close-modal-btn" class="btn-close">&times;</button>
            </div>
            <!-- Сюда динамически переносится форма для мобильных -->
            <div id="modal-form-container"></div>
        </div>
    </div>

    <!-- Боковая панель настроек -->
    <div id="settings-sidebar" class="sidebar hidden">
        <div id="sidebar-close-overlay" class="sidebar-overlay"></div>
        <div class="sidebar-content glass-element">
            <div class="sidebar-header">
                <h2 style="font-size: 18px; font-weight: 800;">Настройки</h2>
                <button id="close-settings-btn" class="btn-close">&times;</button>
            </div>

            <!-- Вкладки настроек -->
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="tab-view">Вид</button>
                <button class="tab-btn" data-tab="tab-theme">Тема</button>
                <button class="tab-btn" data-tab="tab-feedback">Идея / Отзыв</button>
            </div>

            <!-- Вкладка: Вид -->
            <div id="tab-view" class="tab-content active">
                <div class="setting-item">
                    <label for="view-style-select">Стиль отображения прогресса</label>
                    <select id="view-style-select">
                        <option value="cubes">Кубики-ячейки</option>
                        <option value="counter">Простой счетчик</option>
                        <option value="progress-ring">Круговой прогресс</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="font-family-select">Шрифт</label>
                    <select id="font-family-select">
                        <option value="Montserrat">Montserrat</option>
                        <option value="SF Pro Display">SF Pro Display</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                        <option value="Impact">Impact</option>
                    </select>
                </div>
                <div class="setting-item">
                    <div style="display: flex; align-items: center; margin-bottom: 8px;">
                        <input type="checkbox" id="show-deadlines-checkbox" checked style="cursor: pointer;">
                        <label for="show-deadlines-checkbox" style="margin: 0; cursor: pointer;">Отображать дедлайны</label>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="deadline-format-select">Формат таймера дедлайна</label>
                    <select id="deadline-format-select">
                        <option value="dms">Дни, часы, минуты, секунды</option>
                        <option value="dm">Дни, часы, минуты</option>
                        <option value="d">Только дни</option>
                    </select>
                </div>
            </div>

            <!-- Вкладка: Тема -->
            <div id="tab-theme" class="tab-content">
                <div class="setting-item">
                    <label for="theme-preset">Готовые стили оформления</label>
                    <select id="theme-preset">
                        <option value="custom">Пользовательская (Своя)</option>
                        <option value="blue-neon">Синий неон</option>
                        <option value="cyber-cyan">Кибер-циан</option>
                        <option value="purple-neon">Пурпурный неон</option>
                        <option value="burgundy">Бордовый</option>
                        <option value="graphite" selected>Графит (По умолчанию)</option>
                        <option value="dark-gray">Темно-серый</option>
                        <option value="matte-gray">Матовый серый</option>
                        <option value="pitch-black">Глубокий черный</option>
                        <option value="light-silver">Светлое серебро</option>
                        <option value="starlight">Звездный свет</option>
                        <option value="alpine-green">Альпийский зеленый</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="theme-bg">Цвет фона страницы</label>
                    <input type="color" id="theme-bg" value="#121214" style="width: 100%; height: 40px; border: 1px solid var(--border-rgba); border-radius: 8px; background: none; cursor: pointer;">
                </div>
                <div class="setting-item">
                    <label for="theme-text-color">Цвет текста и акцентов</label>
                    <input type="color" id="theme-text-color" value="#ffffff" style="width: 100%; height: 40px; border: 1px solid var(--border-rgba); border-radius: 8px; background: none; cursor: pointer;">
                </div>
                <div class="setting-item">
                    <label for="theme-blur">Размытие стекла (Blur): <span id="blur-val">16px</span></label>
                    <div class="range-container">
                        <input type="range" id="theme-blur" min="0" max="30" value="16" style="width: 100%;">
                    </div>
                </div>
                <div class="setting-item">
                    <label for="theme-border-opacity">Прозрачность границ: <span id="border-val">15%</span></label>
                    <div class="range-container">
                        <input type="range" id="theme-border-opacity" min="0" max="100" value="15" style="width: 100%;">
                    </div>
                </div>
                <div class="setting-item" style="margin-top: 15px;">
                    <button id="reset-theme-btn" class="btn btn-secondary" style="width: 100%;">Сбросить тему</button>
                </div>
            </div>

            <!-- Вкладка: Идея / Отзыв -->
            <div id="tab-feedback" class="tab-content">
                <div class="setting-item">
                    <label for="feedback-text">Предложить идею или сообщить об ошибке</label>
                    <textarea id="feedback-text" rows="5" placeholder="Опишите вашу идею или то, что можно улучшить..." style="width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border-rgba); border-radius: 10px; color: var(--text-color); font-size: 14px; font-family: var(--main-font); outline: none; resize: none;"></textarea>
                    <div class="setting-hint" style="margin-top: 8px;">
                        Сообщение будет отправлено разработчику напрямую через Telegram.
                    </div>
                </div>
                <button id="send-feedback-btn" class="btn btn-success" style="width: 100%; margin-top: 10px;">
                    🚀 Отправить разработчику
                </button>
            </div>

            <!-- Общие кнопки внизу настроек -->
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-rgba);">
                <button id="clear-all-btn" class="btn btn-accent-danger" style="width: 100%;">Удалить все данные</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
